<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Isaac Lab 3.0: one environment, three physics engines</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- card background so the diagram reads in light and dark themes -->
  <rect x="0" y="0" width="760" height="470" rx="14" fill="#ffffff"/>

  <!-- Isaac Lab environment -->
  <rect x="190" y="20" width="380" height="58" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="380" y="44" text-anchor="middle" font-size="16" font-weight="600" fill="#1e1b4b">Isaac Lab environment</text>
  <text x="380" y="64" text-anchor="middle" font-size="12.5" fill="#3730a3">same code: observations, actions, reward</text>

  <line x1="380" y1="78" x2="380" y2="104" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- USD stage -->
  <rect x="150" y="106" width="460" height="78" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="380" y="130" text-anchor="middle" font-size="16" font-weight="600" fill="#0f172a">USD stage</text>
  <text x="380" y="151" text-anchor="middle" font-size="12.5" fill="#334155">paddle rig (MJCF → layered USD), ball, ground</text>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#64748b">USD layers: neutral physics + PhysX + MuJoCo</text>

  <!-- branches -->
  <path d="M300,184 L300,204 L150,204 L150,254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M460,184 L460,204 L540,204 L540,254" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="234" font-size="11.5" fill="#64748b" font-family="ui-monospace, Menlo, monospace">physics=isaacsim_physx</text>
  <text x="550" y="226" font-size="11.5" fill="#64748b" font-family="ui-monospace, Menlo, monospace">physics=newton_mjwarp</text>
  <text x="550" y="242" font-size="11.5" fill="#64748b" font-family="ui-monospace, Menlo, monospace">   or newton_kamino</text>

  <!-- PhysX backend -->
  <rect x="40" y="256" width="220" height="190" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="150" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#7c2d12">PhysX backend</text>
  <text x="150" y="303" text-anchor="middle" font-size="12" fill="#9a3412">reads the USD directly</text>
  <rect x="68" y="340" width="164" height="70" rx="9" fill="#ffffff" stroke="#f97316" stroke-width="1.2"/>
  <text x="150" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">PhysX solver</text>
  <text x="150" y="389" text-anchor="middle" font-size="11.5" fill="#9a3412">pipeline + solver in one</text>
  <line x1="150" y1="312" x2="150" y2="338" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Newton backend -->
  <rect x="300" y="256" width="420" height="190" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="510" y="282" text-anchor="middle" font-size="15" font-weight="600" fill="#064e3b">Newton backend</text>
  <text x="510" y="303" text-anchor="middle" font-size="12" fill="#047857">USD → Newton model (shared by its solvers)</text>
  <path d="M510,312 L510,324 L415,324 L415,338" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M510,324 L605,324 L605,338" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="328" y="340" width="174" height="70" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="415" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">MuJoCo-Warp</text>
  <text x="415" y="389" text-anchor="middle" font-size="11.5" fill="#047857">MuJoCo on the GPU</text>
  <rect x="518" y="340" width="174" height="70" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.2"/>
  <text x="605" y="368" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Kamino</text>
  <text x="605" y="389" text-anchor="middle" font-size="11.5" fill="#047857">Newton solver</text>
  <text x="510" y="434" text-anchor="middle" font-size="11.5" fill="#047857" font-style="italic">same pipeline → differences between these two are purely the solver</text>
</svg>
